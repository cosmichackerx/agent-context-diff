name: Agent Context Diff
description: Review AGENTS.md, CLAUDE.md, Cursor rules and MCP configs in a PR for new MCP servers, wider permissions and hidden text.
author: cosmichackerx
branding:
  icon: shield
  color: purple
inputs:
  base:
    description: Base ref or SHA. Defaults to the pull request base SHA, or HEAD~1 outside pull requests.
    default: ""
  head:
    description: Head ref or SHA. Defaults to the pull request head SHA, or HEAD.
    default: ""
  working-directory:
    description: Directory inside the git repository to run in.
    default: "."
  fail-on:
    description: Lowest severity that fails the step (high, medium, low, info, never).
    default: never
  format:
    description: Report format (text, markdown, json, github, sarif).
    default: github
  output-file:
    description: Optional file to write the report to (replaces stdout).
    default: ""
  summary:
    description: Also append a Markdown report to the job summary (true or false).
    default: "true"
  check-divergence:
    description: Also report AGENTS.md / CLAUDE.md pairs in one directory that differ (true or false).
    default: "false"
  comment:
    description: "Post the Markdown report as one sticky pull request comment, updated in place on every run (true or false). Needs pull-requests: write; skipped for forks."
    default: "false"
  github-token:
    description: "Token used for the sticky comment."
    default: ${{ github.token }}
  node-version:
    description: Node.js version used to run the tool (20 or newer).
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Build agent-context-diff
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
      run: |
        cd "$ACTION_DIR"
        npm ci --ignore-scripts --no-audit --no-fund
        npm run build
    - name: Run agent-context-diff
      shell: bash
      env:
        ACTION_DIR: ${{ github.action_path }}
        INPUT_BASE: ${{ inputs.base || github.event.pull_request.base.sha || 'HEAD~1' }}
        INPUT_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || 'HEAD' }}
        INPUT_WD: ${{ inputs.working-directory }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_DIVERGENCE: ${{ inputs.check-divergence }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        cli="$ACTION_DIR/dist/src/cli.js"
        range="$INPUT_BASE...$INPUT_HEAD"
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          summary_args=()
          if [ "$INPUT_DIVERGENCE" = "true" ]; then summary_args+=(--check-divergence); fi
          node "$cli" -C "$INPUT_WD" "$range" --format markdown "${summary_args[@]}" >> "$GITHUB_STEP_SUMMARY" || true
        fi
        if [ "$INPUT_COMMENT" = "true" ]; then
          comment_args=()
          if [ "$INPUT_DIVERGENCE" = "true" ]; then comment_args+=(--check-divergence); fi
          report="${RUNNER_TEMP:-/tmp}/agent-context-diff-comment.md"
          node "$cli" -C "$INPUT_WD" "$range" --format markdown "${comment_args[@]}" > "$report" || true
          node "$ACTION_DIR/dist/src/comment-cli.js" "$report"
        fi
        extra=()
        if [ "$INPUT_DIVERGENCE" = "true" ]; then extra+=(--check-divergence); fi
        args=(-C "$INPUT_WD" "$range" --format "$INPUT_FORMAT" --fail-on "$INPUT_FAIL_ON" "${extra[@]}")
        if [ -n "$INPUT_OUTPUT_FILE" ]; then args+=(--output "$INPUT_OUTPUT_FILE"); fi
        node "$cli" "${args[@]}"
