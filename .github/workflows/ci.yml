name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and smoke-test the tarball
        run: |
          npm pack --silent
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/agent-context-diff-*.tgz
          npx --no-install agent-context-diff --version
          npx --no-install agent-context-diff --list-rules | head -5

  action-selftest:
    name: action-selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create a fixture repository with a risky change
        run: |
          fx="${RUNNER_TEMP}/fx"
          mkdir -p "$fx/.claude"
          cd "$fx"
          git init -q -b main
          git config user.email ci@example.com
          git config user.name ci
          printf '# Rules\n- Never push to main.\n' > AGENTS.md
          printf '{"mcpServers":{}}\n' > .mcp.json
          printf '# Claude\n- Be concise.\n' > CLAUDE.md
          git add -A && git commit -qm base
          printf '# Rules\n' > AGENTS.md
          printf '{"mcpServers":{"x":{"command":"npx","args":["-y","some-server"]}}}\n' > .mcp.json
          git add -A && git commit -qm risky
      - name: Action reports findings and passes with fail-on=never
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/fx
          base: HEAD~1
          head: HEAD
          fail-on: never
          format: json
          output-file: ${{ runner.temp }}/report.json
      - name: Report contains the expected findings
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/report.json', 'utf8'));
            const rules = r.findings.map((f) => f.rule);
            for (const id of ['mcp-server-added', 'mcp-unpinned-package', 'ctx-guardrail-removed']) {
              if (!rules.includes(id)) { console.error('missing', id, rules); process.exit(1); }
            }
          "
      - name: Divergence check is opt-in (check-divergence input)
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/fx
          base: HEAD~1
          head: HEAD
          format: json
          check-divergence: "true"
          output-file: ${{ runner.temp }}/divergence.json
      - name: Report contains the divergence finding only when asked
        run: |
          node -e "
            const read = (f) => JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/' + f, 'utf8')).findings.map((x) => x.rule);
            if (!read('divergence.json').includes('ctx-files-diverge')) { console.error('missing ctx-files-diverge'); process.exit(1); }
            if (read('report.json').includes('ctx-files-diverge')) { console.error('ctx-files-diverge must be opt-in'); process.exit(1); }
          "
      - name: SARIF output for code scanning
        uses: ./
        with:
          working-directory: ${{ runner.temp }}/fx
          base: HEAD~1
          head: HEAD
          format: sarif
          output-file: ${{ runner.temp }}/report.sarif
      - name: SARIF report is well formed
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/report.sarif', 'utf8'));
            if (r.version !== '2.1.0' || !r.runs[0].results.some((x) => x.ruleId === 'mcp-server-added')) { console.error('bad sarif'); process.exit(1); }
          "
      - name: Action fails with fail-on=high
        id: gate
        uses: ./
        continue-on-error: true
        with:
          working-directory: ${{ runner.temp }}/fx
          base: HEAD~1
          head: HEAD
          fail-on: high
      - name: The gate must have failed
        if: steps.gate.outcome != 'failure'
        run: echo "expected fail-on=high to fail the step" >&2 && exit 1

  comment-selftest:
    name: sticky comment (same-repo pull requests)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: First run creates the comment
        uses: ./
        with:
          comment: "true"
          summary: "false"
      - name: Second run updates the same comment
        uses: ./
        with:
          comment: "true"
          summary: "false"
      - name: Exactly one sticky comment exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- agent-context-diff:sticky -->"))] | length' | awk '{s+=$1} END{print s+0}')"
          echo "sticky comments: $n"
          test "$n" = "1"

  dependabot-gaps:
    name: dependabot-gaps (released action, consumer test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cosmichackerx/dependabot-gaps@v0.2.0
        with:
          fail-on: warning
          # on pull requests: only gaps the PR introduces (needs fetch-depth: 0 above)
          pr-mode: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
